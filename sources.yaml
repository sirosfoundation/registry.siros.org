# sources.yaml — registry.siros.org site instance
# Declares which repositories provide credential schemas.
#
# Meta-sources auto-discover repos by GitHub topic.
# Explicit sources (git:<url>) override any meta-source entry for the same repo.
# Auto-discovered repos use each repo's default branch.

sources:
  # Auto-discover all repos tagged "vctm" across GitHub
  - "github:topic/vctm"

  # Explicit entries (these repos keep credential data on the vctm branch)
  - url: "git:https://github.com/sirosfoundation/demo-credentials.git"
    branch: vctm
  - url: "git:https://github.com/leifj/vctm-template.git"
    branch: vctm

  # EUDI-style rulebook catalog (uses rulebook-catalog layout plugin)
  - url: "git:https://github.com/webuild-consortium/webuild-attestation-rulebooks-catalog.git"
    organization: "webuild-consortium"
    layout: "rulebook-catalog"
    options:
      attestation_los: "iso_18045_high"
      binding_type: "key"
    credentials:
      # The plugin reads selective disclosure out of each schema property's
      # description, which is the only machine-readable place the catalogue
      # states it. EBWOID states it nowhere in the schema: the rule is in the
      # rulebook prose only ("Attributes of the EBWOID SHALL NOT be
      # selectively disclosable", rb-ebwoid 5.1, traceability row
      # EW-DM-12-034), so without this the published metadata falls back to
      # the SD-JWT VC default of "allowed" and says the opposite.
      #
      # Only credentials whose rulebook fixes a policy the schema does not
      # state belong here. EUCC is deliberately absent: its rulebook allows
      # selective disclosure of company attributes, so the default is already
      # right.
      ebwoid:
        disclosure:
          default: never
